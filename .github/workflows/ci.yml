name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  api:
    name: api (build, vet, fmt, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build
        run: go build ./apps/api/...
      - name: Vet
        run: go vet ./apps/api/...
      - name: Format
        run: |
          unformatted=$(gofmt -l apps/api)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"; echo "$unformatted"; exit 1
          fi
      - name: Test
        run: go test ./apps/api/...

  web:
    name: web (build - CRA + antd)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build