name: sana

services:
  api:
    build: ./apps/api
    restart: unless-stopped
    # MongoDB is remote (Atlas) — credentials come from apps/api/.env.
    env_file:
      - ./apps/api/.env
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s